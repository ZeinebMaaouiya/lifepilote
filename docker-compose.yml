
version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL database
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lifepilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifepilot}
      POSTGRES_USER: ${POSTGRES_USER:-lifepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifepilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Redis (Celery broker + result backend)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lifepilot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────
  # FastAPI application
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifepilot_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifepilot}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lifepilot}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ──────────────────────────────────────────────
  # Celery worker (notification delivery)
  # ──────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifepilot_worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifepilot}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lifepilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q notifications,emails,default

  # ──────────────────────────────────────────────
  # Celery beat (recurring task scheduler)
  # ──────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifepilot_beat
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifepilot}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lifepilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - worker
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler

volumes:
  postgres_data:
  redis_data:
