name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lifepilot
          POSTGRES_USER: lifepilot
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://lifepilot:ci-only@localhost:5432/lifepilot
      PAYLOAD_SECRET: ci-test-secret-not-for-deployment
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - name: Migrate and smoke-test the API
        working-directory: backend
        run: |
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lifepilot-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          python scripts/smoke_test.py
