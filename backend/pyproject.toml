[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifepilot-backend"
version = "0.1.0"
description = "LifePilot AI — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "kombu>=5.4.0",

    # AI providers
    "openai>=1.57.0",
    "anthropic>=0.40.0",

    # Web Push
    "pywebpush>=2.0.0",

    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.4",

    # Utilities
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "babel>=2.16.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Security
    "cryptography>=43.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated Alembic revisions are not hand-maintained source.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
